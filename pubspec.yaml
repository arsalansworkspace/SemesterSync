name: semester_sync
description: "A new Flutter project for managing semester projects and timetables."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter



  # UI & Helpers
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # Storage & Database (Web-compatible)
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^0.4.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  timezone: ^0.9.4
  # Notifications & Media Handling
  flutter_local_notifications: ^17.1.2

  image_picker: ^1.1.2
  image_picker_for_web: ^3.0.4
  path_provider: ^2.1.3
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

